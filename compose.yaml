name: faq-service

x-app: &app
  build: .
  image: faq-service:local
  env_file:
    - ${ENV_FILE:-.env}
  environment:
    DATABASE_HOST: db
    DATABASE_PORT: 5432
    TRAIN_DATA_PATH: /data/train_our.jsonl
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-faq}
      POSTGRES_USER: ${DATABASE_USER:-faq}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ingest:
    <<: *app
    command: [python, -m, faq_service.application.ingestion.pipeline]
    volumes:
      - ./temp/data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
